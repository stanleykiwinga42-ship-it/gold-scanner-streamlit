# Put this file at:  .github/workflows/monitor.yml
# It keeps the scanner running 24/7 even when the Streamlit page is closed.

name: Scanner monitor

on:
  schedule:
    - cron: "0 * * * *"      # every hour: queues the next job behind the running one
  workflow_dispatch:         # lets you start it by hand (Actions tab -> Run workflow)

concurrency:
  group: scanner-monitor     # only one monitor runs at a time
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python monitor.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          POLL_SECONDS: "10"
          MONITOR_MINUTES: "345"
